<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a1d27"/>
  <!-- Lock body -->
  <rect x="18" y="30" width="28" height="22" rx="4" fill="#6366f1"/>
  <!-- Lock shackle -->
  <path d="M22 30 V22 a10 10 0 0 1 20 0 V30" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
  <!-- Calendar lines (sell signal) -->
  <line x1="24" y1="38" x2="40" y2="38" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="24" y1="44" x2="36" y2="44" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Danger dot -->
  <circle cx="44" cy="20" r="7" fill="#ef4444"/>
  <text x="44" y="24" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="sans-serif">!</text>
</svg>
